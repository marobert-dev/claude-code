openapi: 3.1.0
info:
  title: ShopLite API
  version: 1.0.0
  description: |
    HTTP API of the ShopLite demo shop. All error responses use RFC 9457 problem details
    (`application/problem+json`). User-facing messages (`title`, `detail`, validation errors) are
    localized from the `Accept-Language` request header (`en` default, `fr` supported).
servers:
  - url: http://localhost:5080
tags:
  - name: Auth
  - name: Products
  - name: Cart
  - name: Orders
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange demo credentials for a JWT bearer token.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Search the catalog (server-side pagination, sorted by name).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: search
          in: query
          description: Case-insensitive substring of the product name.
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Exact category name.
          schema: { type: string, maxLength: 60 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 12 }
      responses:
        '200':
          description: One page of products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product. Requires the `admin` role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsertRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/products/categories:
    get:
      tags: [Products]
      operationId: listProductCategories
      summary: Distinct category names, sorted alphabetically.
      security: []
      responses:
        '200':
          description: Category names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Product details.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace a product's editable fields. Requires an authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsertRequest' }
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: The signed-in user's cart.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The cart (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/cart/summary:
    get:
      tags: [Cart]
      operationId: getCartSummary
      summary: Number of units and total amount in the signed-in user's cart (for the header badge).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary; an empty cart returns itemCount 0 and total 0.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product to the cart; adding a product already in the cart increases its quantity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/cart/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Set the quantity of one cart line.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove one cart line.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /api/orders:
    post:
      tags: [Orders]
      operationId: checkout
      summary: Turn the signed-in user's cart into an order and empty the cart.
      description: |
        Discounts: 5% when the subtotal is at least 100.00, 10% when it is at least 200.00,
        rounded half away from zero to 2 decimals. Order numbers are `SL-` followed by a 6-digit sequence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '201':
          description: The created order.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: The cart is empty.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: The signed-in user's orders, newest first, with their lines.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: One order with its lines.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/orders/{id}/receipt:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrderReceipt
      summary: Plain-text receipt of one order, localized from Accept-Language.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Receipt text.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [en, fr], default: en }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Problem:
      description: Problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationProblem:
      description: Validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 50 }
        password: { type: string, maxLength: 100 }
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, username, role]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        username: { type: string }
        role: { type: string, enum: [customer, admin] }
    ProductSummary:
      type: object
      required: [id, name, category, price, inStock]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        price: { type: number, format: decimal }
        inStock: { type: boolean }
    ProductSummaryPage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
    Product:
      type: object
      required: [id, name, description, category, price, stock]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: decimal }
        stock: { type: integer }
    ProductUpsertRequest:
      type: object
      required: [name, category, price, stock]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, minLength: 1, maxLength: 60 }
        price: { type: number, format: decimal, minimum: 0.01, maximum: 100000 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
    CartItem:
      type: object
      required: [id, productId, productName, unitPrice, quantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        unitPrice: { type: number, format: decimal }
        quantity: { type: integer }
    Cart:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartSummary:
      type: object
      required: [itemCount, total]
      properties:
        itemCount: { type: integer, minimum: 0, description: Sum of the quantities of every cart line. }
        total: { type: number, format: decimal, description: Sum of unitPrice x quantity. }
    AddCartItemRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, minimum: 1 }
        quantity: { type: integer, default: 1 }
        unitPrice:
          type: [number, 'null']
          format: decimal
          description: Unit price stored on the cart line. Defaults to the catalog price when omitted.
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer }
    OrderLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: decimal }
        lineTotal: { type: number, format: decimal }
    Order:
      type: object
      required: [id, number, createdAtUtc, subtotal, discount, total, lines]
      properties:
        id: { type: integer }
        number: { type: string, pattern: '^SL-\d{6}$' }
        createdAtUtc: { type: string, format: date-time }
        subtotal: { type: number, format: decimal }
        discount: { type: number, format: decimal }
        total: { type: number, format: decimal }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
